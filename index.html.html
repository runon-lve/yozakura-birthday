<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>君と咲かせた、ありがとうの花</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1531;color:#fff;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}.app{max-width:540px;margin:auto;min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 74%,#35466e,#162345 65%,#0a1430);}.moon{position:absolute;right:12%;top:13%;width:65px;height:65px;border-radius:50%;background:#fff0d7;box-shadow:0 0 35px #ffe9be55}.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 11% 15%,#fff 90%,transparent),radial-gradient(2px 2px at 31% 25%,#fff 90%,transparent),radial-gradient(1px 1px at 69% 10%,#fff 90%,transparent),radial-gradient(1px 1px at 88% 34%,#fff 90%,transparent);opacity:.55;animation:breath 5s ease-in-out infinite alternate}@keyframes breath{to{opacity:.8}}header{position:absolute;top:4%;width:100%;padding:0 12px;text-align:center;z-index:2;text-shadow:0 2px 12px #0a1430}h1{font-size:clamp(18px,5vw,24px);font-weight:500;letter-spacing:.08em}header p{font-size:12px;color:#e6d8ec;line-height:1.8}.tree{position:absolute;left:0;bottom:12%;width:100%;height:68%;overflow:visible}.ground{position:absolute;bottom:-7%;left:-20%;width:140%;height:22%;border-radius:50%;background:radial-gradient(ellipse,#425475,#192747 70%)}.blossom{position:absolute;width:47px;height:47px;transform:translate(-50%,-50%) scale(0);border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 0 5px #ffb3db66);transition:transform 1s cubic-bezier(.2,1.4,.5,1),filter .3s;z-index:3}.blossom.open{transform:translate(-50%,-50%) scale(1)}.blossom.read{filter:drop-shadow(0 0 12px #ffe9b9)}.blossom svg{width:100%;height:100%}.blossom:focus-visible{outline:2px solid #fff;border-radius:50%}.controls{position:absolute;bottom:5%;left:0;width:100%;text-align:center;z-index:5;padding:0 15px}.controls p{font-size:13px;color:#f9e5f2;min-height:22px}button.primary{border:1px solid #f5d1e7;background:#f4d9e9;color:#503954;border-radius:25px;padding:13px 25px;font-weight:bold;font-size:14px;cursor:pointer}.secondary{border:1px solid #ffffff77;background:#19274a99;color:#fff;border-radius:20px;padding:8px 17px;margin-top:12px}.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:#0b1532b8;z-index:10}.modal.show{display:flex}.paper{width:100%;max-width:390px;border-radius:20px;background:#fff8f7;color:#4b3c55;padding:25px 22px;text-align:center;box-shadow:0 20px 70px #070d25aa;animation:appear .45s ease}.paper h2{color:#9b608f;font-size:19px}.paper p{font-size:14px;line-height:2;white-space:pre-line}@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}.petal{position:absolute;top:-30px;z-index:7;pointer-events:none;animation:fall 5s linear forwards;color:#ffcae1}@keyframes fall{to{transform:translate(45px,110vh) rotate(450deg);opacity:0}}@media(prefers-reduced-motion:reduce){.stars,.petal{animation:none}.blossom{transition:none}}</style></head><body><main class="app" id="app"><div class="stars"></div><div class="moon"></div><header><h1>君と咲かせた、ありがとうの花</h1><p>離れていても、想いはひとつの木になる。</p></header><div class="ground"></div><svg class="tree" viewBox="0 0 360 420" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><defs><linearGradient id="wood"><stop stop-color="#34263c"/><stop offset=".5" stop-color="#75516a"/><stop offset="1" stop-color="#382a45"/></linearGradient><radialGradient id="mist"><stop stop-color="#e6a5d2" stop-opacity=".45"/><stop offset="1" stop-color="#e6a5d2" stop-opacity="0"/></radialGradient></defs><g fill="none" stroke="url(#wood)" stroke-linecap="round"><path d="M180 435 Q185 318 177 226 Q170 164 157 125" stroke-width="27"/><path d="M180 296 Q129 224 55 205 M177 261 Q236 184 310 178 M174 219 Q113 146 93 98 M180 203 Q233 122 251 79 M157 128 Q165 85 176 53" stroke-width="13"/><path d="M117 230 Q83 183 37 167 M234 205 Q274 147 326 133 M110 161 Q71 125 66 85 M226 137 Q262 104 286 64" stroke-width="6"/></g><g fill="url(#mist)"><ellipse cx="177" cy="118" rx="98" ry="78"/><ellipse cx="97" cy="182" rx="91" ry="71"/><ellipse cx="267" cy="169" rx="88" ry="75"/><ellipse cx="178" cy="211" rx="103" ry="66"/></g></svg><div id="flowers"></div><div class="controls"><p id="status">まだ静かな夜。あなたへの想いが待っています。</p><button id="start" class="primary">想いを受け取る 🌸</button><div><button id="again" class="secondary" hidden>もう一度、花を咲かせる</button></div></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="手紙"><div class="paper"><div style="font-size:27px">💌</div><h2 id="sender"></h2><p id="message"></p><button class="primary" id="close">夜桜に戻る 🌸</button></div></div></main><script>(()=>{const app=document.getElementById('app'),box=document.getElementById('flowers'),status=document.getElementById('status'),start=document.getElementById('start'),again=document.getElementById('again'),modal=document.getElementById('modal');const messages=[['おともだち A','いつも楽しい時間をありがとう！\nあなたの配信に出会えて本当によかった。'],['おともだち B','初めて話した日を覚えてるよ。\nこれからも一緒に笑おうね！'],['おともだち C','何気ない毎日を特別にしてくれてありがとう。'],['おともだち D','離れていても、いつも大切な友達だよ。'],['おともだち E','素敵な一年になりますように。\nお誕生日おめでとう！']];const positions=[[27,42],[49,31],[75,43],[35,57],[67,59]];const svg='<svg viewBox="0 0 60 60" aria-hidden="true"><g fill="#f7b9da" stroke="#fff1f7" stroke-width="1"><ellipse cx="30" cy="17" rx="11" ry="15"/><ellipse cx="43" cy="26" rx="11" ry="15" transform="rotate(72 43 26)"/><ellipse cx="38" cy="43" rx="11" ry="15" transform="rotate(144 38 43)"/><ellipse cx="22" cy="43" rx="11" ry="15" transform="rotate(216 22 43)"/><ellipse cx="17" cy="26" rx="11" ry="15" transform="rotate(288 17 26)"/></g><circle cx="30" cy="30" r="7" fill="#ffe7aa"/></svg>';let read=new Set(),finished=false,running=false;const buttons=messages.map((m,i)=>{const b=document.createElement('button');b.className='blossom';b.style.left=positions[i][0]+'%';b.style.top=positions[i][1]+'%';b.innerHTML=svg;b.setAttribute('aria-label','秘密の花 '+(i+1));b.onclick=()=>{if(!b.classList.contains('open'))return;read.add(i);b.classList.add('read');document.getElementById('sender').textContent=m[0]+'からの手紙';document.getElementById('message').textContent=m[1];modal.classList.add('show');status.textContent=`${read.size} / ${messages.length} 輪の想いを読みました`};box.appendChild(b);return b});function petals(){for(let i=0;i<24;i++){let p=document.createElement('span');p.className='petal';p.textContent='✿';p.style.left=Math.random()*100+'%';p.style.fontSize=(9+Math.random()*11)+'px';p.style.animationDelay=Math.random()*2+'s';app.appendChild(p);setTimeout(()=>p.remove(),7500)}}function showFinal(){if(finished)return;finished=true;petals();document.getElementById('sender').textContent='お誕生日おめでとう！';document.getElementById('message').textContent='あなたと出会えたことが、私たちの宝物です。\nこれからも一緒に、たくさんの花を咲かせようね。';modal.classList.add('show')}document.getElementById('close').onclick=()=>{modal.classList.remove('show');if(read.size===messages.length&&!finished)setTimeout(showFinal,500)};async function bloom(){if(running)return;running=true;finished=false;read.clear();buttons.forEach(b=>b.classList.remove('open','read'));start.hidden=true;again.hidden=true;status.textContent='ひとつ、またひとつ。想いが花になっていく。';await new Promise(r=>setTimeout(r,1100));for(let i=0;i<buttons.length;i++){buttons[i].classList.add('open');await new Promise(r=>setTimeout(r,780))}status.textContent='5輪の花が咲きました。花をタップしてみてね。';again.hidden=false;running=false}start.onclick=bloom;again.onclick=bloom})();</script></body></html>
