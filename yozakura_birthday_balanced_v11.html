.scene{background:
 radial-gradient(ellipse at 73% 23%,#c4a1b222 0%,transparent 33%),
 radial-gradient(ellipse at 52% 73%,#735477 0%,#293153 42%,#0a1633 85%);
 border:1px solid #e3c9e331;box-shadow:0 25px 85px #030717a6}
.scene:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
 background:linear-gradient(180deg,#07132b11 0%,transparent 45%,#f4b7d013 78%,#15132c44 100%)}
.moon{width:76px;top:12%;right:14%;background:radial-gradient(circle at 32% 28%,#fffdf3,#fff0da 70%,#f1d2ce);box-shadow:0 0 24px #fff4e6aa,0 0 95px #ffdde37a,0 0 155px #d6b1ef40}
.tree{height:88%;bottom:-4%;z-index:2;filter:drop-shadow(0 0 9px #e9a8d055)}
.tree .canopy use{opacity:0;transform:scale(.1);transform-box:fill-box;transform-origin:center;transition:opacity 1.6s ease,transform 1.8s cubic-bezier(.2,.8,.25,1);transition-delay:var(--delay)}
.scene.opened .tree .canopy use{opacity:.88;transform:scale(1)}

header{top:4.5%;z-index:5}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600;font-size:clamp(18px,4.8vw,24px);text-shadow:0 2px 14px #070c27}
header p{color:#f7ddeb;letter-spacing:.08em}
.intro{background:linear-gradient(180deg,#09132fe9,#141632d4);backdrop-filter:blur(2px)}
.intro p{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.05em}
.letter{background:linear-gradient(155deg,#fffafc,#fbeaf4);border:1px solid #fff;box-shadow:0 15px 65px #080b2eaa}
.letter h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.primary{background:linear-gradient(110deg,#ffe1eb,#d8b9ee);box-shadow:0 0 25px #f6badb88}
.status{z-index:8;bottom:22px}
.decor{z-index:3}

.scene:before{background:linear-gradient(180deg,#0c123849 0%,transparent 35%,#170f3012 75%,#0c102e50 100%)!important;z-index:1}
.canopy-layer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.canopy-flower{position:absolute;display:block;width:var(--sz);height:var(--sz);opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(var(--rot));transform-origin:center;filter:drop-shadow(0 0 4px #ffc2e2b5);transition:opacity 1.25s ease,transform 1.7s cubic-bezier(.16,.85,.22,1);transition-delay:var(--wait)}
.scene.opened .canopy-flower{opacity:var(--op);transform:translate(-50%,-50%) scale(1) rotate(var(--rot))}
.canopy-flower svg{width:100%;height:100%;overflow:visible}
.blossom{z-index:6!important;color:#ffe7f3!important;text-shadow:0 0 5px #fff,0 0 17px #f3a1db,0 0 28px #f5c0ee!important}
.intro{z-index:10!important}
.status{z-index:9!important}
.overlay{z-index:20!important}
#flowers{position:absolute;inset:0;z-index:6;pointer-events:none}
#flowers button{pointer-events:auto}

/* 手紙の花だけを見分けやすく：白桜の色味はそのまま */
#flowers .blossom{color:#fff0f7!important;text-shadow:0 0 5px #fff,0 0 12px #ffe0f2,0 0 24px #ffcae7!important;isolation:isolate;overflow:visible}
#flowers .blossom::before{content:"";position:absolute;inset:1px;border-radius:50%;background:radial-gradient(circle,#fff6f9aa 0%,#f9d0e080 38%,#f1a4c633 63%,transparent 76%);box-shadow:0 0 12px 5px #f5b9d866,0 0 26px 8px #f6c2e53d;z-index:-1;pointer-events:none;animation:letterGlow 3.8s ease-in-out infinite}
#flowers .blossom::after{content:"";position:absolute;inset:-5px;border:1px solid #ffe5f1a6;border-radius:50%;box-shadow:0 0 9px #fff2f4a6;pointer-events:none;opacity:.78;animation:letterRing 3.8s ease-in-out infinite}
#flowers .blossom.read::before{background:radial-gradient(circle,#fff9e4bb,#fce4b866 44%,transparent 75%)}
#flowers .blossom.read::after{border-color:#ffe5b9a8}
@keyframes letterGlow{0%,100%{opacity:.68;filter:brightness(1)}50%{opacity:1;filter:brightness(1.16)}}
@keyframes letterRing{0%,100%{opacity:.45}50%{opacity:.92}}
@media(prefers-reduced-motion:reduce){#flowers .blossom::before,#flowers .blossom::after{animation:none;opacity:.9}}

/* Ver.4: 未読は白桃色、既読ははっきりしたシャンパンゴールド */
#flowers .blossom.read{color:#ffdc76!important;text-shadow:0 0 5px #fff9dd,0 0 13px #ffcf67,0 0 29px #f2a83b!important;filter:drop-shadow(0 0 8px #ffd36d)!important}
#flowers .blossom.read::before{background:radial-gradient(circle,#fff5beee 0%,#ffd47dbb 38%,#efb34466 65%,transparent 78%)!important;box-shadow:0 0 15px 7px #ffda7888,0 0 30px 11px #ffbe434d!important;animation:none!important;opacity:1!important}
#flowers .blossom.read::after{border:1.5px solid #ffe39c!important;box-shadow:0 0 12px #ffcf73b8!important;animation:none!important;opacity:1!important}

/* 既読の花だけ淡い桜ピンクに。未読の白い光は維持 */
.blossom.read{color:#f5b6d2!important;text-shadow:0 0 13px #efa3c8,0 0 27px #e995bf88!important;filter:drop-shadow(0 0 8px #efa3c8)!important}

/* Ver.6: 既読花の金色指定を完全に上書き。未読の白ピンクは維持 */
#flowers .blossom.read{color:#f4b0d1!important;text-shadow:0 0 5px #fff0f8,0 0 14px #ee9ec8,0 0 28px #e88dbb!important;filter:drop-shadow(0 0 8px #e995bf)!important}
#flowers .blossom.read::before{background:radial-gradient(circle,#fff0f8e8 0%,#f5b6d2b8 38%,#e995bf66 65%,transparent 78%)!important;box-shadow:0 0 14px 6px #efa3c877,0 0 27px 9px #e995bf44!important;animation:none!important;opacity:1!important}
#flowers .blossom.read::after{border:1.5px solid #f5c1dc!important;box-shadow:0 0 11px #eea6cb99!important;animation:none!important;opacity:.9!important}

/* Ver.7 ending: add-only; existing cherry blossom styling untouched */
.ending-invite{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:#0b1433bd;backdrop-filter:blur(3px);opacity:0;transition:opacity 1.3s ease}
.ending-invite.visible{display:flex;opacity:1}
.ending-invite h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;letter-spacing:.1em;color:#ffe6f2;text-shadow:0 0 16px #f4acd5;margin:0 0 18px}
.envelope-button{border:0;background:transparent;padding:14px 12px;color:#fff3fa;display:flex;align-items:center;flex-direction:column;gap:15px;animation:envelopeFloat 3.6s ease-in-out infinite}
.envelope-icon{width:190px;height:126px;position:relative;border-radius:8px;background:linear-gradient(145deg,#fff6fa,#eec6dd);box-shadow:0 14px 40px #060a2699,0 0 28px #f2bbdc88;overflow:hidden}
.envelope-icon:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 49%,#e9b8d3 50%,transparent 51%),linear-gradient(215deg,transparent 49%,#e9b8d3 50%,transparent 51%)}
.envelope-icon:after{content:"🌸";position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:30px;filter:drop-shadow(0 2px 5px #bb7eab)}
.envelope-button span:last-child{font-size:13px;letter-spacing:.06em;color:#ffe5f3}
.ending-invite p{font-size:12px;color:#ead6ec;line-height:2;margin:15px 0 0}
@keyframes envelopeFloat{50%{transform:translateY(-9px)}}
.ending-letter .letter{animation:letterReveal .7s cubic-bezier(.18,.8,.25,1) both;border:1px solid #f7c8e0}
@keyframes letterReveal{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.envelope-button{animation:none}.ending-letter .letter{animation:none}.ending-invite{transition:none}}

/* Ver.10: 思い出の花園 (existing night-sakura artwork unchanged) */
#gardenButton[hidden],#garden[hidden]{display:none!important}
#gardenButton{border:1px solid #e6c3df;background:linear-gradient(110deg,#f8d5e8,#d6c4f3);color:#4d345a;border-radius:99px;padding:9px 16px;font-weight:700}
#garden{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 0%,#3d315a,#151b36 55%,#0b1329);overflow-y:auto;overscroll-behavior:contain;color:#fff2f9;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.garden-inner{max-width:680px;margin:0 auto;padding:24px 17px 50px}
.garden-head{text-align:center;padding:12px 0 20px}

.garden-head p{color:#dfc9e5;font-size:13px;line-height:1.9}
.garden-tools{position:sticky;top:0;z-index:1;background:#191d38ed;padding:12px;border:1px solid #d7b8d744;border-radius:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;backdrop-filter:blur(12px)}

orm="rotate(216)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(288)"/></g><circle r="2.1" fill="#ffdf9f"/></svg></span><span class="canopy-flower" style="left:68.14%;top:68.01%;--sz:14.5px;--wait:3.17s;--op:0.88;--rot:-48deg"><svg viewBox="-12 -12 24 24"><g fill="#ffeaf4"><ellipse cy="-5.1" rx="4.3" ry="6.4"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(72)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(144)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(216)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(288)"/></g><circle r="2.1" fill="#ffdf9f"/></svg></span><span class="canopy-flower" style="left:70.02%;top:60.53%;--sz:25.9px;--wait:2.83s;--op:0.82;--rot:43deg"><svg viewBox="-12 -12 24 24"><g fill="#ffd2e9"><ellipse cy="-5.1" rx="4.3" ry="6.4"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(72)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(144)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(216)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(288)"/></g><circle r="2.1" fill="#ffdf9f"/></svg></span><span class="canopy-flower" style="left:73.73%;top:62.78%;--sz:13.0px;--wait:2.25s;--op:1.00;--rot:31deg"><svg viewBox="-12 -12 24 24"><g fill="#f8b5da"><ellipse cy="-5.1" rx="4.3" ry="6.4"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(72)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(144)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(216)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(288)"/></g><circle r="2.1" fill="#ffdf9f"/></svg></span><span class="canopy-flower" style="left:66.95%;top:70.33%;--sz:18.2px;--wait:2.51s;--op:0.86;--rot:29deg"><svg viewBox="-12 -12 24 24"><g fill="#fff4f5"><ellipse cy="-5.1" rx="4.3" ry="6.4"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(72)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(144)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(216)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(288)"/></g><circle r="2.1" fill="#ffdf9f"/></svg></span><span class="canopy-flower" style="left:71.86%;top:74.83%;--sz:14.7px;--wait:2.58s;--op:0.82;--rot:14deg"><svg viewBox="-12 -12 24 24"><g fill="#ffd2e9"><ellipse cy="-5.1" rx="4.3" ry="6.4"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(72)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(144)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(216)"/><ellipse cy="-5.1" rx="4.3" ry="6.4" transform="rotate(288)"/></g><circle r="2.1" fill="#ffdf9f"/></svg></span></div><div id="flowers"></div><div id="decor"></div><div class="status" id="status" aria-live="polite">🌸 まだ花は咲いていません</div><div class="intro" id="intro"><p>あなたに伝えたい想いがあります。<br>この木に、みんなの気持ちを込めました。</p><button class="primary" id="start">想いを受け取る 🌸</button></div><button id="nextFlowers" class="next-flowers" type="button" hidden>次の花を咲かせる 🌸</button><div class="ending-invite" id="endingInvite" aria-hidden="true"><h2>みんなから、あなたへ</h2><button class="envelope-button" id="openEnding" type="button" aria-label="最後の特別なお手紙を開く"><span class="envelope-icon" aria-hidden="true"></span><span>封筒をタップしてね 💌</span></button><p>最後に、もうひとつだけ。<br>あなたに届けたい想いがあります。</p></div><div class="overlay" id="overlay"><div class="letter" role="dialog" aria-modal="true" aria-labelledby="letterName"><div style="font-size:28px">💌</div><h2 id="letterName"></h2><p id="letterText"></p><button class="secondary" id="close">夜桜に戻る 🌸</button></div></div></section><div class="under"><span>🌙 夜桜サイト・白桜と桜ピンクの既読花 Ver.11（お手紙取り込み版）</span><button id="reopenEnding" type="button" hidden>最後の手紙をもう一度 💌</button><button id="gardenButton" type="button" hidden>思い出の花園へ 🌸</button><button id="replay">最初から見る ↻</button></div><p class="hint">※ お手紙は作成時に取り込まれています。Googleフォームとの自動同期はありません。</p></main><section id="garden" hidden aria-label="思い出の花園"><div class="garden-inner"><div class="garden-head"><div>✦ 🌸 ✦</div><h2>思い出の花園</h2><p>あなたに届いた、たくさんの想い。<br>いつでもここで、読み返してね。</p></div><div class="garden-tools"><input id="gardenSearch" type="search" placeholder="お名前で探す 🔎" aria-label="お名前でメッセージを検索"><button id="gardenBack" type="button">夜桜に戻る 🌙</button></div><div id="gardenCards"></div></div></section><script>
(()=>{'use strict';
const messages=[{"name":"テストの妖精🌸","message":"お誕生日おめでとう！🌙\nこれは夜桜サイトのリハーサル用のお手紙だよ♡\n綺麗な桜が咲きますように🌸"},{"name":"星の妖精⭐","message":"お誕生日おめでとう！\nいつも素敵な時間をありがとう。これからもたくさん笑って過ごそうね！🌙"},{"name":"月の妖精🌙","message":"Happy Birthday！🎂\nあなたに出会えて本当によかった！これからの1年も幸せでいっぱいになりますように🌸"}];
const finalMessage='あなたと出会えたことが、私たちの宝物です。\nこれからも一緒に、たくさんの花を咲かせていこうね。';
const positions=[[27,42],[49,32],[75,44],[35,59],[67,59],[51,52],[18,54],[81,60],[44,69],[62,22],[23,28],[78,30]];
const PAGE_SIZE=12;
// Divide all letters into balanced groups of at most 12, without a lonely last flower.
const GROUP_COUNT=Math.ceil(messages.length/PAGE_SIZE);
const GROUP_BASE=GROUP_COUNT?Math.floor(messages.length/GROUP_COUNT):0;
const GROUP_EXTRA=GROUP_COUNT?messages.length%GROUP_COUNT:0;
function groupStart(p){return p*GROUP_BASE+Math.min(p,GROUP_EXTRA)}
function groupSize(p){return GROUP_BASE+(p<GROUP_EXTRA?1:0)}
const $=id=>document.getElementById(id),scene=document.querySelector('.scene');
let flowers=[],read=new Set(),finished=false,timers=[],page=0,started=false;
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function petals(){for(let i=0;i<26;i++){const el=document.createElement('span');el.className='petal';el.textContent='✿';el.style.left=Math.random()*100+'%';el.style.fontSize=(10+Math.random()*12)+'px';el.style.animationDelay=Math.random()*1.5+'s';scene.appendChild(el);later(()=>el.remove(),7000)}}
function indices(){return Array.from({length:groupSize(page)},(_,i)=>groupStart(page)+i)}
function pageDone(){return indices().every(i=>read.has(i))}
function update(){const r=read.size,n=messages.length;let phrase='🌸 花をタップして手紙を読んでね';if(r>0&&r<n){const progress=r/n;phrase=progress<.34?'🌸 想いが少しずつ花開いています':progress<.67?'🌸 夜桜が優しく色づいてきました':'🌸 たくさんの想いが、満開へと近づいています'}if(r===n)phrase='🌸 すべての想いが花開きました';$('status').textContent=phrase;const next=$('nextFlowers');next.hidden=!started||finished||!pageDone()||page+1>=GROUP_COUNT;}
function openLetter(i){if(!flowers[i]||!flowers[i].classList.contains('bloom'))return;read.add(i);flowers[i].classList.add('read');$('letterName').textContent=messages[i].name+'からの手紙';$('letterText').textContent=messages[i].message;$('overlay').classList.remove('ending-letter');$('overlay').classList.add('visible');update()}
function buildPage(animate){$('flowers').replaceChildren();flowers=[];indices().forEach((i,j)=>{let b=document.createElement('button');b.className='blossom';b.type='button';b.textContent='✿';b.style.left=positions[j][0]+'%';b.style.top=positions[j][1]+'%';b.setAttribute('aria-label','秘密の花 '+(i+1));b.addEventListener('click',()=>openLetter(i));$('flowers').appendChild(b);flowers[i]=b;if(read.has(i))b.classList.add('read');if(animate)later(()=>b.classList.add('bloom'),300+j*170);else b.classList.add('bloom')});update()}
function renderGarden(){const query=$('gardenSearch').value.trim().toLocaleLowerCase();const cards=$('gardenCards');cards.replaceChildren();let count=0;messages.forEach(m=>{if(!m.name.toLocaleLowerCase().includes(query))return;count++;const card=document.createElement('article');card.className='garden-card';const title=document.createElement('h3');title.textContent='🌸 '+m.name;const body=document.createElement('p');body.textContent=m.message;card.append(title,body);cards.appendChild(card)});if(!count){const empty=document.createElement('p');empty.className='garden-empty';empty.textContent='該当するお名前が見つかりませんでした 🌸';cards.appendChild(empty)}}
function openGarden(){if(!finished||!$('overlay').classList.contains('visible')&&$('reopenEnding').hidden)return;$('overlay').classList.remove('visible','ending-letter');$('gardenSearch').value='';renderGarden();$('garden').hidden=false;document.body.style.overflow='hidden';$('garden').scrollTop=0}
function closeGarden(){$('garden').hidden=true;document.body.style.overflow='';$('gardenButton').focus()}
$('gardenButton').addEventListener('click',openGarden);
$('gardenBack').addEventListener('click',closeGarden);
$('gardenSearch').addEventListener('input',renderGarden);
function reset(){timers.forEach(clearTimeout);timers=[];read=new Set();finished=false;page=0;started=false;scene.classList.remove('opened');$('overlay').classList.remove('visible','ending-letter');$('endingInvite').classList.remove('visible');$('endingInvite').setAttribute('aria-hidden','true');$('reopenEnding').hidden=true;$('gardenButton').hidden=true;$('garden').hidden=true;document.body.style.overflow='';$('nextFlowers').hidden=true;$('intro').style.display='flex';$('status').textContent='🌸 まだ花は咲いていません';document.querySelectorAll('.petal').forEach(p=>p.remove());$('flowers').replaceChildren();$('decor').replaceChildren()}
$('start').addEventListener('click',()=>{started=true;$('intro').style.display='none';later(()=>scene.classList.add('opened'),650);$('status').textContent='🌸 みんなの想いが咲いていきます…';later(()=>{buildPage(true);petals();for(let j=0;j<12;j++){const d=document.createElement('span');d.className='decor';d.textContent='✿';d.style.left=(10+Math.random()*78)+'%';d.style.top=(18+Math.random()*51)+'%';d.style.fontSize=(11+Math.random()*16)+'px';$('decor').appendChild(d);later(()=>d.classList.add('show'),40+j*60)}},1100)});
$('nextFlowers').addEventListener('click',()=>{if(!pageDone()||page+1>=GROUP_COUNT)return;page++;$('nextFlowers').hidden=true;buildPage(true);petals()});
function showEndingInvite(){if(finished)return;finished=true;$('nextFlowers').hidden=true;petals();later(()=>{const invite=$('endingInvite');invite.classList.add('visible');invite.setAttribute('aria-hidden','false');$('openEnding').focus()},1250)}
$('close').addEventListener('click',()=>{$('overlay').classList.remove('visible','ending-letter');if(read.size===messages.length&&!finished)showEndingInvite();else if(finished){$('endingInvite').classList.remove('visible');$('endingInvite').setAttribute('aria-hidden','true');$('reopenEnding').hidden=false;$('gardenButton').hidden=false;$('status').textContent='🌸 すべての想いが花開きました'}});
$('openEnding').addEventListener('click',()=>{$('endingInvite').classList.remove('visible');$('endingInvite').setAttribute('aria-hidden','true');$('letterName').textContent='みんなから、あなたへ 💌';$('letterText').textContent=finalMessage;$('overlay').classList.add('ending-letter','visible')});
$('reopenEnding').addEventListener('click',()=>{$('letterName').textContent='みんなから、あなたへ 💌';$('letterText').textContent=finalMessage;$('overlay').classList.add('ending-letter','visible')});
$('replay').addEventListener('click',reset);reset();
})();
</script></body></html>
