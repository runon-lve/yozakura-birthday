</svg><div id="flowers"></div><div id="decor"></div><div class="status" id="status" aria-live="polite">🌸 まだ花は咲いていません</div><div class="intro" id="intro"><p>あなたに伝えたい想いがあります。<br>この木に、みんなの気持ちを込めました。</p><button class="primary" id="start">想いを受け取る 🌸</button></div><div class="overlay" id="overlay"><div class="letter" role="dialog" aria-modal="true" aria-labelledby="letterName"><div style="font-size:28px">💌</div><h2 id="letterName"></h2><p id="letterText"></p><button class="secondary" id="close">夜桜に戻る 🌸</button></div></div></section><div class="under"><span>🌙 Safari / スマホ対応デモ</span><button id="replay">最初から見る ↻</button></div><p class="hint">※ これは動作確認用のサンプルです。メッセージは仮の5件で、まだ投稿・共有保存機能はありません。</p></main><script>
(()=>{'use strict';const messages=[{name:'おともだち A',message:'いつも楽しい時間をありがとう！\nあなたの配信に出会えて本当によかった。'},{name:'おともだち B',message:'何気ない毎日が、あなたのおかげで特別になったよ。'},{name:'おともだち C',message:'これからも一緒にたくさん笑おうね！'},{name:'おともだち D',message:'離れていても大切な友達だよ。'},{name:'おともだち E',message:'これからも素敵な思い出を作っていこうね！'}];const positions=[[27,42],[49,32],[75,44],[35,59],[67,59],[51,52],[18,54],[81,60],[44,69],[62,22],[23,28],[78,30],[58,73],[15,35],[88,47],[37,22],[66,37],[28,72],[75,70],[51,17]];const $=id=>document.getElementById(id);const scene=document.querySelector('.scene');let flowers=[],read=new Set(),finished=false,timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function petals(){for(let i=0;i<26;i++){const el=document.createElement('span');el.className='petal';el.textContent='✿';el.style.left=(Math.random()*100)+'%';el.style.fontSize=(10+Math.random()*12)+'px';el.style.animationDelay=(Math.random()*1.5)+'s';scene.appendChild(el);later(()=>el.remove(),7000)}}function update(){ $('status').textContent=read.size?'🌸 '+read.size+' / '+messages.length+' 通の想いを受け取りました':'🌸 花をタップして手紙を読んでね'}function openLetter(i){if(!flowers[i].classList.contains('bloom'))return;read.add(i);flowers[i].classList.add('read');$('letterName').textContent=messages[i].name+'からの手紙';$('letterText').textContent=messages[i].message;$('overlay').classList.add('visible');update()}function build(){flowers=[];$('flowers').replaceChildren();$('decor').replaceChildren();messages.forEach((m,i)=>{let b=document.createElement('button');b.className='blossom';b.type='button';b.textContent='✿';b.style.left=positions[i%positions.length][0]+'%';b.style.top=positions[i%positions.length][1]+'%';b.setAttribute('aria-label','秘密の花 '+(i+1));b.addEventListener('click',()=>openLetter(i));$('flowers').appendChild(b);flowers.push(b)})}function reset(){timers.forEach(clearTimeout);timers=[];read=new Set();finished=false;scene.classList.remove('opened');$('overlay').classList.remove('visible');$('intro').style.display='flex';$('status').textContent='🌸 まだ花は咲いていません';document.querySelectorAll('.petal').forEach(p=>p.remove());build()}$('start').addEventListener('click',()=>{$('intro').style.display='none';scene.classList.add('opened');$('status').textContent='🌸 みんなの想いが咲いていきます…';const step=Math.min(1150,Math.max(330,8000/messages.length));flowers.forEach((b,i)=>later(()=>{b.classList.add('bloom');if(i===flowers.length-1)later(()=>{update();petals();for(let j=0;j<12;j++){const d=document.createElement('span');d.className='decor';d.textContent='✿';d.style.left=(10+Math.random()*78)+'%';d.style.top=(18+Math.random()*51)+'%';d.style.fontSize=(11+Math.random()*16)+'px';$('decor').appendChild(d);later(()=>d.classList.add('show'),40+j*60)}},900)},650+i*step))});$('close').addEventListener('click',()=>{$('overlay').classList.remove('visible');if(read.size===messages.length&&!finished){finished=true;later(()=>{petals();$('letterName').textContent='お誕生日おめでとう！ 🎂';$('letterText').textContent='あなたと出会えたことが、私たちの宝物です。\nこれからも一緒に、たくさんの花を咲かせていこうね。';$('overlay').classList.add('visible')},500)}});$('replay').addEventListener('click',reset);build()})();
</script></body></html>
